# 站点基础信息
baseURL: "https://blog.qyzzyqlqj.dpdns.org/"
title: Qyz's Blog
theme: [hugo-PaperMod]

# Hugo 构建与功能开关
enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
mainsections: ["posts", "papermod"]

# 输出配置：必须包含 JSON，用于 PaperMod 生成搜索索引 (index.json)
outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true

pagination:
  pagerSize: 3

# 1. 语言与主菜单配置
languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 2
        - name: Search
          url: search/
          weight: 2
        - name: Tags
          url: tags/
          weight: 4

# 2. PaperMod 主题参数
params:
  env: production
  defaultTheme: auto
  ShowShareButtons: false       # 隐藏分享图标
  hideFooter: true              # 隐藏页脚信息
  ShowReadingTime: true
  disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  images: ["images/papermod-cover.png"]
  math: true                    # 开启数学公式

  assets:
    disableHLJS: true

# 3. Markdown 与渲染配置
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        patterns:
          inline:
            - ['$', '$']
            - ['\\(', '\\)']
          block:
            - ['$$', '$$']
            - ['\\[', '\\]']
  highlight:
    noClasses: false