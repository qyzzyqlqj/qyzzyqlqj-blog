# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://blog.qyzzyqlqj.dpdns.org/"
title: Qyz's Blog
copyright: ""
theme: [hugo-PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 3

# 1. 语言与主菜单配置（仅保留英文，移除 fr/fa 及 Docs 菜单）
languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 2
        - name: Search
          url: search/
          weight: 2
        - name: Tags
          url: tags/
          weight: 4

# 2. 核心主题参数配置（注意 params: 节点及缩进）
params:
  env: production
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: false       # 隐藏分享图标
  hideFooter: true             # 隐藏页脚 Powered by 信息
  ShowReadingTime: true
  disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  #homeInfoParams:
  #  Title: "Qyz's Blog"
  #  Content: |
  #    Welcome!

  socialIcons:

  editPost:
    URL: "https://github.com/adityatelange/hugo-PaperMod/tree/exampleSite/content"
    Text: "Suggest Changes"
    appendFilePath: true

  assets:
    disableHLJS: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true